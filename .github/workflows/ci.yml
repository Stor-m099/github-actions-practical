name: Python CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  APP_ENV: production

jobs:
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest app/test_app.py

      - name: Display application environment
        run: echo "Application environment: $APP_ENV"

      - name: Use application secret
        env:
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          echo "APP_SECRET has been provided securely."
          echo "The secret value will not be displayed."

      - name: CI pipeline completed successfully
        if: success()
        run: echo "CI pipeline completed successfully."

      - name: CI pipeline failed
        if: failure()
        run: echo "CI pipeline failed."

  build:
    name: Build Application
    needs: test
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create build directory
        run: mkdir -p build

      - name: Copy application files
        run: cp app/app.py app/test_app.py requirements.txt build/

      - name: Create ZIP file
        run: |
          cd build
          zip -r ../github-actions-build.zip .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: github-actions-build.zip

      - name: Build completed successfully
        if: success()
        run: echo "Build and artifact upload completed successfully."

      - name: Build failed
        if: failure()
        run: echo "Build job failed."
